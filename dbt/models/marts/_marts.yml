# Marts: contracts are enforced (dbt_project.yml), so each column's type is part of the
# model's interface, and a build that returns anything else fails.
version: 2
models:
- name: dim_player
  description: One row per person who appears in a match (Cricsheet register identity).
  columns:
  - name: player_id
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: player_name
    data_type: varchar
    data_tests:
    - not_null
  - name: unique_name
    data_type: varchar
    data_tests:
    - not_null
  - name: key_cricinfo
    data_type: varchar
  - name: in_register
    data_type: boolean
    data_tests:
    - not_null
  - name: first_match_date
    data_type: date
    data_tests:
    - not_null
  - name: last_match_date
    data_type: date
    data_tests:
    - not_null
  - name: ipl_matches
    data_type: integer
    data_tests:
    - not_null
  - name: t20i_matches
    data_type: integer
    data_tests:
    - not_null
  - name: date_of_birth
    data_type: date
  - name: nationality
    description: Override, else Wikidata country for sport, else Wikipedia infobox country, else latest T20I team, else citizenship.
    data_type: varchar
  - name: nationality_source
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [override, wikidata_sport_country, wikipedia_country, t20i_team, wikidata_citizenship]
  - name: batting_hand
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [left, right]
  - name: bowling_kind
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [pace, spin]
  - name: bowling_arm
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [left, right]
  - name: is_keeper
    data_type: boolean
    data_tests:
    - not_null
- name: dim_player_history
  description: >-
    SCD Type 2 player attributes: one row per version, valid from the snapshot that first
    showed it until the one that replaced it. Rebuilt from every raw attribute snapshot.
  columns:
  - name: player_version_key
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: player_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_player')
          field: player_id
  - name: date_of_birth
    data_type: date
  - name: nationality
    description: Override, else Wikidata country for sport, else Wikipedia infobox country, else latest T20I team, else citizenship.
    data_type: varchar
  - name: nationality_source
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [override, wikidata_sport_country, wikipedia_country, t20i_team, wikidata_citizenship]
  - name: batting_hand
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [left, right]
  - name: bowling_kind
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [pace, spin]
  - name: bowling_arm
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values: [left, right]
  - name: is_keeper
    data_type: boolean
    data_tests:
    - not_null
  - name: bowling_style_raw
    description: DBpedia's bowling values as received, "|"-joined.
    data_type: varchar
  - name: wikipedia_fields
    description: Fields filled from the Wikipedia infobox where Wikidata and DBpedia had none, "|"-joined.
    data_type: varchar
  - name: override_fields
    description: Fields taken from the overrides CSV, "|"-joined; null when none.
    data_type: varchar
  - name: valid_from
    data_type: timestamp
    data_tests:
    - not_null
  - name: valid_to
    description: Null for the current version.
    data_type: timestamp
  - name: is_current
    data_type: boolean
    data_tests:
    - not_null
- name: dim_team
  description: 'One row per team: IPL franchises (renames share an id) and national T20I sides.'
  columns:
  - name: team_id
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: team_name
    data_type: varchar
    data_tests:
    - not_null
  - name: competition
    data_type: varchar
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - ipl
          - t20i
  - name: is_full_member_nation
    data_type: boolean
    data_tests:
    - not_null
  - name: first_season_in_data
    data_type: integer
  - name: last_season_in_data
    data_type: integer
- name: dim_venue
  description: One row per ground; IPL grounds curated, other names as recorded.
  columns:
  - name: venue_id
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: venue_name
    data_type: varchar
    data_tests:
    - not_null
  - name: city
    data_type: varchar
  - name: country
    data_type: varchar
  - name: is_curated
    data_type: boolean
    data_tests:
    - not_null
- name: dim_season
  description: One row per competition season, with rule flags.
  columns:
  - name: season_key
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: competition
    data_type: varchar
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - ipl
          - t20i
  - name: season
    data_type: integer
    data_tests:
    - not_null
  - name: matches
    data_type: integer
    data_tests:
    - not_null
  - name: first_match_date
    data_type: date
    data_tests:
    - not_null
  - name: last_match_date
    data_type: date
    data_tests:
    - not_null
  - name: impact_player_rule
    data_type: boolean
    data_tests:
    - not_null
- name: fact_delivery
  description: 'Grain: one row per ball bowled, wides and no-balls included.'
  columns:
  - name: delivery_key
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: match_id
    data_type: varchar
    data_tests:
    - not_null
  - name: innings_number
    data_type: integer
    data_tests:
    - not_null
  - name: over_number
    data_type: integer
    data_tests:
    - not_null
  - name: ball_in_over
    data_type: integer
    data_tests:
    - not_null
  - name: competition
    data_type: varchar
    data_tests:
    - not_null
  - name: season
    data_type: integer
    data_tests:
    - not_null
  - name: season_key
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_season')
          field: season_key
  - name: match_date
    data_type: date
    data_tests:
    - not_null
  - name: venue_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_venue')
          field: venue_id
  - name: batting_team_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_team')
          field: team_id
  - name: bowling_team_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_team')
          field: team_id
  - name: batter_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_player')
          field: player_id
  - name: non_striker_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_player')
          field: player_id
  - name: bowler_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_player')
          field: player_id
  - name: phase
    data_type: varchar
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - powerplay
          - middle
          - death
          - super_over
  - name: is_super_over
    data_type: boolean
    data_tests:
    - not_null
  - name: runs_batter
    data_type: integer
    data_tests:
    - not_null
  - name: runs_extras
    data_type: integer
    data_tests:
    - not_null
  - name: runs_total
    data_type: integer
    data_tests:
    - not_null
  - name: extras_wides
    data_type: integer
    data_tests:
    - not_null
  - name: extras_noballs
    data_type: integer
    data_tests:
    - not_null
  - name: extras_byes
    data_type: integer
    data_tests:
    - not_null
  - name: extras_legbyes
    data_type: integer
    data_tests:
    - not_null
  - name: extras_penalty
    data_type: integer
    data_tests:
    - not_null
  - name: runs_conceded
    data_type: integer
    data_tests:
    - not_null
  - name: is_legal
    data_type: boolean
    data_tests:
    - not_null
  - name: is_dot
    data_type: boolean
    data_tests:
    - not_null
  - name: is_four
    data_type: boolean
    data_tests:
    - not_null
  - name: is_six
    data_type: boolean
    data_tests:
    - not_null
  - name: n_wickets
    data_type: integer
    data_tests:
    - not_null
  - name: bowler_wicket
    data_type: boolean
    data_tests:
    - not_null
  - name: batter_dismissed
    data_type: boolean
    data_tests:
    - not_null
  - name: is_full_member_t20i
    data_type: boolean
    data_tests:
    - not_null
- name: fact_team_match
  description: 'Grain: one row per team per match.'
  columns:
  - name: team_match_key
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: match_id
    data_type: varchar
    data_tests:
    - not_null
  - name: team_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_team')
          field: team_id
  - name: opponent_team_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_team')
          field: team_id
  - name: competition
    data_type: varchar
    data_tests:
    - not_null
  - name: season
    data_type: integer
    data_tests:
    - not_null
  - name: season_key
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_season')
          field: season_key
  - name: match_date
    data_type: date
    data_tests:
    - not_null
  - name: venue_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_venue')
          field: venue_id
  - name: home_status
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values:
          - home
          - away
          - neutral
  - name: won_toss
    data_type: boolean
    data_tests:
    - not_null
  - name: batted_first
    data_type: boolean
  - name: result
    data_type: varchar
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - won
          - lost
          - tied
          - no_result
  - name: decided_by_super_over
    data_type: boolean
    data_tests:
    - not_null
  - name: win_method
    data_type: varchar
- name: player_ratings_asof
  description: >-
    One row per player per IPL or Full Member T20I match date. Ratings are per ball, shrunk
    toward a role prior (empirical Bayes) and built only from matches before match_date.
    Bowling runs_per_ball x 6 is economy.
  data_tests:
  - unique:
      column_name: "player_id || '|' || match_date"
  columns:
  - name: player_id
    data_type: varchar
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_player')
          field: player_id
  - name: match_date
    data_type: date
    data_tests:
    - not_null
  - name: role
    description: From the decayed share of balls bowled; unknown below rating_min_role_balls.
    data_type: varchar
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [batter, all_rounder, bowler, unknown]
  - name: bowl_share
    description: Decayed balls bowled / (balls faced + balls bowled); null with no history.
    data_type: double
  - name: source_match_date
    description: Latest match date of the evidence used; null for a player with no history.
    data_type: date
  - name: prior_year
    description: Priors were estimated from evidence before 1 January of this year.
    data_type: integer
    data_tests:
    - not_null
  - name: bat_powerplay_runs_per_ball
    description: Shrunk batting runs per ball, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bat_middle_runs_per_ball
    description: Shrunk batting runs per ball, middle. Null only when no prior exists yet.
    data_type: double
  - name: bat_death_runs_per_ball
    description: Shrunk batting runs per ball, death. Null only when no prior exists yet.
    data_type: double
  - name: bat_powerplay_dismissal_rate
    description: Shrunk batting dismissals per ball, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bat_middle_dismissal_rate
    description: Shrunk batting dismissals per ball, middle. Null only when no prior exists yet.
    data_type: double
  - name: bat_death_dismissal_rate
    description: Shrunk batting dismissals per ball, death. Null only when no prior exists yet.
    data_type: double
  - name: bowl_powerplay_runs_per_ball
    description: Shrunk bowling runs per ball, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bowl_middle_runs_per_ball
    description: Shrunk bowling runs per ball, middle. Null only when no prior exists yet.
    data_type: double
  - name: bowl_death_runs_per_ball
    description: Shrunk bowling runs per ball, death. Null only when no prior exists yet.
    data_type: double
  - name: bowl_powerplay_wicket_rate
    description: Shrunk bowling wickets credited to the bowler per ball, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bowl_middle_wicket_rate
    description: Shrunk bowling wickets credited to the bowler per ball, middle. Null only when no prior exists yet.
    data_type: double
  - name: bowl_death_wicket_rate
    description: Shrunk bowling wickets credited to the bowler per ball, death. Null only when no prior exists yet.
    data_type: double
  - name: bowl_powerplay_dot_rate
    description: Shrunk bowling dot balls per ball, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bowl_middle_dot_rate
    description: Shrunk bowling dot balls per ball, middle. Null only when no prior exists yet.
    data_type: double
  - name: bowl_death_dot_rate
    description: Shrunk bowling dot balls per ball, death. Null only when no prior exists yet.
    data_type: double
  - name: bat_powerplay_balls
    description: Decayed, competition-weighted balls faced, powerplay.
    data_type: double
    data_tests:
    - not_null
  - name: bat_middle_balls
    description: Decayed, competition-weighted balls faced, middle.
    data_type: double
    data_tests:
    - not_null
  - name: bat_death_balls
    description: Decayed, competition-weighted balls faced, death.
    data_type: double
    data_tests:
    - not_null
  - name: bowl_powerplay_balls
    description: Decayed, competition-weighted legal balls bowled, powerplay.
    data_type: double
    data_tests:
    - not_null
  - name: bowl_middle_balls
    description: Decayed, competition-weighted legal balls bowled, middle.
    data_type: double
    data_tests:
    - not_null
  - name: bowl_death_balls
    description: Decayed, competition-weighted legal balls bowled, death.
    data_type: double
    data_tests:
    - not_null
  - name: bat_powerplay_vs_pace_runs_per_ball
    description: Shrunk batting runs per ball against pace bowlers, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bat_powerplay_vs_pace_dismissal_rate
    description: Shrunk batting dismissals per ball against pace bowlers, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bat_powerplay_vs_spin_runs_per_ball
    description: Shrunk batting runs per ball against spin bowlers, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bat_powerplay_vs_spin_dismissal_rate
    description: Shrunk batting dismissals per ball against spin bowlers, powerplay. Null only when no prior exists yet.
    data_type: double
  - name: bat_middle_vs_pace_runs_per_ball
    description: Shrunk batting runs per ball against pace bowlers, middle. Null only when no prior exists yet.
    data_type: double
  - name: bat_middle_vs_pace_dismissal_rate
    description: Shrunk batting dismissals per ball against pace bowlers, middle. Null only when no prior exists yet.
    data_type: double
  - name: bat_middle_vs_spin_runs_per_ball
    description: Shrunk batting runs per ball against spin bowlers, middle. Null only when no prior exists yet.
    data_type: double
  - name: bat_middle_vs_spin_dismissal_rate
    description: Shrunk batting dismissals per ball against spin bowlers, middle. Null only when no prior exists yet.
    data_type: double
  - name: bat_death_vs_pace_runs_per_ball
    description: Shrunk batting runs per ball against pace bowlers, death. Null only when no prior exists yet.
    data_type: double
  - name: bat_death_vs_pace_dismissal_rate
    description: Shrunk batting dismissals per ball against pace bowlers, death. Null only when no prior exists yet.
    data_type: double
  - name: bat_death_vs_spin_runs_per_ball
    description: Shrunk batting runs per ball against spin bowlers, death. Null only when no prior exists yet.
    data_type: double
  - name: bat_death_vs_spin_dismissal_rate
    description: Shrunk batting dismissals per ball against spin bowlers, death. Null only when no prior exists yet.
    data_type: double
  - name: bat_powerplay_vs_pace_balls
    description: Decayed, competition-weighted balls faced against pace bowlers of known bowling kind, powerplay.
    data_type: double
    data_tests:
    - not_null
  - name: bat_powerplay_vs_spin_balls
    description: Decayed, competition-weighted balls faced against spin bowlers of known bowling kind, powerplay.
    data_type: double
    data_tests:
    - not_null
  - name: bat_middle_vs_pace_balls
    description: Decayed, competition-weighted balls faced against pace bowlers of known bowling kind, middle.
    data_type: double
    data_tests:
    - not_null
  - name: bat_middle_vs_spin_balls
    description: Decayed, competition-weighted balls faced against spin bowlers of known bowling kind, middle.
    data_type: double
    data_tests:
    - not_null
  - name: bat_death_vs_pace_balls
    description: Decayed, competition-weighted balls faced against pace bowlers of known bowling kind, death.
