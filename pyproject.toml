[project]
name = "cricket-value"
version = "0.1.0"
description = "IPL squad value and auction picker: a layered, tested T20 data platform"
readme = "Project_brief.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.13.26",
    "httpx>=0.27",
    "pandas>=2.2",
    "pandera[pandas]>=0.35.0",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "dagster-webserver>=1.13.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cricket_value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cricket_value", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Dagster's resource and result classes are generic but used unparameterised in its docs
[[tool.mypy.overrides]]
module = ["cricket_value.orchestration.*"]
disallow_any_generics = false
